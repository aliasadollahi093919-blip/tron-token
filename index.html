<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TRON TRC-20 Token Creator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:#0b1020;color:#eef2ff}
.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#121a2b;border:1px solid #26324a;border-radius:20px;padding:20px;box-shadow:0 12px 40px #0004}
h1{font-size:24px;margin:0 0 8px}.muted{color:#9aa8c3;font-size:14px;line-height:1.8}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#173d2c;color:#70e1a1;font-size:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:#b9c4da;margin:8px 0 6px}
input,textarea{width:100%;background:#0b1221;border:1px solid #2b3852;color:#fff;border-radius:12px;padding:12px;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#5d8cff}textarea{min-height:90px;resize:vertical}
button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;background:#2d6cff;color:#fff}
button.secondary{background:#1c2940}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{margin-top:14px;padding:12px;border-radius:12px;background:#0b1221;border:1px solid #27344d;white-space:pre-wrap;line-height:1.7}
pre{direction:ltr;text-align:left;overflow:auto;background:#080d18;padding:14px;border-radius:12px;font-size:12px}
a{color:#75a5ff}.small{font-size:12px;color:#8795ad}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <span class="badge">TRON MAINNET • TRC-20</span>
  <h1>ساخت توکن TRC-20</h1>
  <div class="muted">اتصال مستقیم به TronLink؛ کلید خصوصی در این صفحه دریافت یا ذخیره نمی‌شود.</div>

  <div class="grid">
    <div><label>نام توکن</label><input id="name" placeholder="مثلاً My Token"></div>
    <div><label>نماد</label><input id="symbol" placeholder="مثلاً MYT"></div>
    <div><label>تعداد کل توکن</label><input id="supply" type="number" min="1" step="1" value="1000000"></div>
    <div><label>Decimals</label><input id="decimals" type="number" min="0" max="18" value="18"></div>
  </div>

  <label>Logo URL / IPFS URI</label>
  <input id="logo" placeholder="https://... یا ipfs://...">

  <div class="grid">
    <div><label>Website</label><input id="website" placeholder="https://example.com"></div>
    <div><label>Telegram</label><input id="telegram" placeholder="https://t.me/..."></div>
    <div><label>X / Twitter</label><input id="twitter" placeholder="https://x.com/..."></div>
  </div>

  <label>توضیحات</label>
  <textarea id="description" placeholder="توضیح کوتاه درباره توکن"></textarea>

  <div class="row">
    <button id="connect">اتصال TronLink</button>
    <button id="meta" class="secondary">دانلود Metadata JSON</button>
  </div>
  <button id="deploy">ساخت توکن روی TRON Mainnet</button>

  <div id="status" class="status">وضعیت: آماده</div>

  <div class="small" style="margin-top:14px">
    نکته: فایل لوگو به‌تنهایی روی بلاکچین آپلود نمی‌شود. برای نمایش لوگو در کیف پول‌ها و سرویس‌ها، باید یک URL عمومی یا IPFS URI معتبر ثبت شود.
  </div>

  <details style="margin-top:18px">
    <summary>قرارداد استفاده‌شده</summary>
    <pre id="source"></pre>
  </details>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tronweb@6.1.0/dist/TronWeb.js"></script>
<script src="https://cdn.jsdelivr.net/npm/solc@0.8.20/solc.min.js"></script>
<script>
const SOURCE = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

contract CustomTRC20 {
    string public name;
    string public symbol;
    uint8 public immutable decimals;
    uint256 public totalSupply;

    string public logoURI;
    string public website;
    string public telegram;
    string public twitter;
    string public description;

    mapping(address => uint256) private balances;
    mapping(address => mapping(address => uint256)) private allowances;

    event Transfer(address indexed from,address indexed to,uint256 value);
    event Approval(address indexed owner,address indexed spender,uint256 value);

    constructor(
        string memory name_,
        string memory symbol_,
        uint8 decimals_,
        uint256 supply_,
        string memory logo_,
        string memory website_,
        string memory telegram_,
        string memory twitter_,
        string memory description_
    ){
        require(bytes(name_).length > 0,"NAME");
        require(bytes(symbol_).length > 0,"SYMBOL");
        require(decimals_ <= 18,"DECIMALS");
        require(supply_ > 0,"SUPPLY");

        name=name_;
        symbol=symbol_;
        decimals=decimals_;
        logoURI=logo_;
        website=website_;
        telegram=telegram_;
        twitter=twitter_;
        description=description_;

        uint256 amount=supply_*(10**uint256(decimals_));
        totalSupply=amount;
        balances[msg.sender]=amount;
        emit Transfer(address(0),msg.sender,amount);
    }

    function balanceOf(address a) external view returns(uint256){return balances[a];}
    function transfer(address to,uint256 amount) external returns(bool){
        _transfer(msg.sender,to,amount); return true;
    }
    function allowance(address owner,address spender) external view returns(uint256){
        return allowances[owner][spender];
    }
    function approve(address spender,uint256 amount) external returns(bool){
        allowances[msg.sender][spender]=amount;
        emit Approval(msg.sender,spender,amount);
        return true;
    }
    function transferFrom(address from,address to,uint256 amount) external returns(bool){
        uint256 a=allowances[from][msg.sender];
        require(a>=amount,"ALLOWANCE");
        if(a!=type(uint256).max) allowances[from][msg.sender]=a-amount;
        _transfer(from,to,amount);
        return true;
    }
    function _transfer(address from,address to,uint256 amount) internal{
        require(to!=address(0),"ZERO");
        require(balances[from]>=amount,"BALANCE");
        balances[from]-=amount;
        balances[to]+=amount;
        emit Transfer(from,to,amount);
    }
}`;
document.getElementById("source").textContent=SOURCE;

const $=id=>document.getElementById(id);
let tronWeb=null, lastAddress=null;

function val(id){return $(id).value.trim()}
function setStatus(s){$("status").textContent=s}
function metadata(address=""){
  return {
    name:val("name"), symbol:val("symbol"), decimals:Number(val("decimals")),
    totalSupply:val("supply"), image:val("logo"), logoURI:val("logo"),
    description:val("description"), external_url:val("website"),
    website:val("website"), telegram:val("telegram"), twitter:val("twitter"),
    chain:"TRON", network:"mainnet", standard:"TRC-20",
    contract_address:address
  };
}
function download(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function connect(){
  try{
    if(!window.tronLink) throw new Error("TronLink پیدا نشد. صفحه را داخل مرورگر TronLink باز کنید.");
    await window.tronLink.request({method:"tron_requestAccounts"});
    tronWeb=window.tronLink.tronWeb;
    if(!tronWeb || !tronWeb.defaultAddress || !tronWeb.defaultAddress.base58)
      throw new Error("حساب TronLink در دسترس نیست.");
    setStatus("متصل شد:\n"+tronWeb.defaultAddress.base58+"\n\nشبکه مورد انتظار: TRON Mainnet");
  }catch(e){setStatus("خطا در اتصال:\n"+(e.message||e))}
}
async function deploy(){
  try{
    if(!tronWeb) await connect();
    if(!tronWeb) return;

    const name=val("name"), symbol=val("symbol"), supply=val("supply");
    const decimals=Number(val("decimals"));
    if(!name||!symbol||!supply||decimals<0||decimals>18) throw new Error("اطلاعات نامعتبر است.");

    setStatus("در حال کامپایل قرارداد...");
    const input={language:"Solidity",sources:{"CustomTRC20.sol":{content:SOURCE}},
      settings:{optimizer:{enabled:true,runs:200},outputSelection:{"*":{"*":["abi","evm.bytecode"]}}}};
    const out=JSON.parse(solc.compile(JSON.stringify(input)));
    const errs=(out.errors||[]).filter(x=>x.severity==="error");
    if(errs.length) throw new Error(errs.map(x=>x.formattedMessage).join("\\n"));
    const c=out.contracts["CustomTRC20.sol"].CustomTRC20;
    const amount=BigInt(supply)*(10n**BigInt(decimals));

    setStatus("در حال ارسال تراکنش ساخت قرارداد...\nTronLink را تأیید کنید.");
    const contract=await tronWeb.contract().new({
      abi:c.abi,
      bytecode:c.evm.bytecode.object,
      feeLimit:1000000000,
      callValue:0,
      userFeePercentage:100,
      originEnergyLimit:10000000,
      parameters:[name,symbol,decimals,amount.toString(),val("logo"),val("website"),val("telegram"),val("twitter"),val("description")]
    });
    lastAddress=contract.address;
    setStatus("توکن با موفقیت ساخته شد.\n\nContract:\n"+lastAddress+
      "\n\nTronScan:\nhttps://tronscan.org/#/contract/"+lastAddress);
  }catch(e){
    setStatus("خطا:\n"+(e.message||e));
  }
}
$("connect").onclick=connect;
$("deploy").onclick=deploy;
$("meta").onclick=()=>download(metadata(lastAddress||""),"token-metadata.json");
</script>
</body>
</html>
